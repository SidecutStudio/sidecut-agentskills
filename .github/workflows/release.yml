name: Release
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      checks: read
    uses: ./.github/workflows/publish-plugin.yml
    with:
      checked-sha: ${{ github.event.workflow_run.head_sha }}
